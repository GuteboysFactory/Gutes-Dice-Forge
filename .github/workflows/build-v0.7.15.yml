name: Build Dice Forge v0.7.15 Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v0.7.15.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.7.15 from stable v0.7.14 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hotfix-build dist-hotfix
          mkdir -p hotfix-build dist-hotfix
          unzip -q genesys-dice-forge.zip -d hotfix-build

          cp module.json hotfix-build/module.json
          cp scripts/api.js hotfix-build/scripts/api.js
          cp scripts/main.js hotfix-build/scripts/main.js
          cp scripts/integration/genesys-auto-bridge.js hotfix-build/scripts/integration/genesys-auto-bridge.js
          cp scripts/integration/render-chat-capture.js hotfix-build/scripts/integration/render-chat-capture.js
          cp scripts/integration/chat-launcher.js hotfix-build/scripts/integration/chat-launcher.js
          cp scripts/integration/face-audit.js hotfix-build/scripts/integration/face-audit.js
          cp styles/chat-launcher.css hotfix-build/styles/chat-launcher.css
          cp styles/face-audit.css hotfix-build/styles/face-audit.css

          python - <<'PY'
          from pathlib import Path

          path = Path('hotfix-build/scripts/render/webgl/webgl-renderer.js')
          source = path.read_text(encoding='utf-8')

          if 'v0.7.14 deterministic landing recovery' not in source:
              raise SystemExit('Expected v0.7.14 stable renderer marker was not found')

          old_constants = '''  hardAssistStartMs: 350,\n  hardAssistRate: 5.4,\n  hardAssistMaxStep: 0.10,\n  absoluteSafetyMs: 5200'''
          new_constants = '''  hardAssistStartMs: 350,\n  hardAssistRate: 6.2,\n  hardAssistMaxStep: 0.12,\n  settleFaceAngle: 0.055,\n  hardStopMs: 4700'''
          if old_constants not in source:
              raise SystemExit('Expected v0.7.14 recovery constants were not found')
          source = source.replace(old_constants, new_constants, 1)

          old_recovery = '''  // v0.7.14 deterministic landing recovery. Once the normal roll is already\n  // deep into its late-energy phase, blend the CURRENT physical orientation a\n  // tiny amount toward the shortest face-up orientation each physics substep.\n  // This stays inside the physics phase so hold/fade never perform a final snap.\n  const hardAssistStart = entry.rollProfile.maxSimulationMs + GUIDED_SETTLE.hardAssistStartMs;\n  if (simulationElapsedMs >= hardAssistStart && angle > GUIDED_SETTLE.sleepFaceAngle) {\n    const overtime = clamp((simulationElapsedMs - hardAssistStart) / 900, 0, 1);\n    const targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n    const assist = clamp(\n      dt * GUIDED_SETTLE.hardAssistRate * (0.45 + overtime * 0.55),\n      0,\n      GUIDED_SETTLE.hardAssistMaxStep\n    );\n    entry.rotation = quatSlerp(entry.rotation, targetRotation, assist);\n\n    const minRoll = 0.34 + overtime * 0.16;\n    entry.angularVelocity[0] += axisX * minRoll * dt;\n    entry.angularVelocity[2] += axisZ * minRoll * dt;\n  }'''
          new_recovery = '''  // v0.7.15 bounded deterministic landing recovery. Keep correction inside the\n  // visible physics phase, but REMOVE angular energy as the target approaches.\n  // v0.7.14 added energy while chasing a 0.025 rad threshold and could therefore\n  // create a self-sustaining wobble/spin instead of ever settling.\n  const hardAssistStart = entry.rollProfile.maxSimulationMs + GUIDED_SETTLE.hardAssistStartMs;\n  if (simulationElapsedMs >= hardAssistStart && angle > GUIDED_SETTLE.settleFaceAngle) {\n    const overtime = clamp((simulationElapsedMs - hardAssistStart) / 850, 0, 1);\n    const targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n    const assist = clamp(\n      dt * GUIDED_SETTLE.hardAssistRate * (0.55 + overtime * 0.45),\n      0,\n      GUIDED_SETTLE.hardAssistMaxStep\n    );\n    entry.rotation = quatSlerp(entry.rotation, targetRotation, assist);\n\n    const angularDamping = Math.pow(0.18, dt);\n    const travelDamping = Math.pow(0.28, dt);\n    entry.angularVelocity[0] *= angularDamping;\n    entry.angularVelocity[2] *= angularDamping;\n    entry.velocity[0] *= travelDamping;\n    entry.velocity[2] *= travelDamping;\n  }'''
          if old_recovery not in source:
              raise SystemExit('Expected v0.7.14 recovery block was not found')
          source = source.replace(old_recovery, new_recovery, 1)

          old_transition = '''          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          const facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.sleepFaceAngle);\n          const absoluteSafetyExpired = elapsed >= GUIDED_SETTLE.absoluteSafetyMs;\n\n          // Never enter hold with the wrong physical face merely because a timer\n          // expired. The authoritative face must be acquired during motion first.\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || (absoluteSafetyExpired && facesReady)) beginSettle(now);'''
          new_transition = '''          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          let facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.settleFaceAngle);\n          const hardStopExpired = elapsed >= GUIDED_SETTLE.hardStopMs;\n\n          if (hardStopExpired && !facesReady) {\n            for (const entry of this.activeDice) {\n              const error = resultFaceError(entry);\n              if (error.angle >= GUIDED_SETTLE.settleFaceAngle) {\n                // Final safety acquisition happens before settle/hold, after the\n                // assisted motion has already been strongly damped. No endless spin.\n                entry.rotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n                entry.angularVelocity[0] = 0;\n                entry.angularVelocity[2] = 0;\n              }\n            }\n            facesReady = true;\n          }\n\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || hardStopExpired) beginSettle(now);'''
          if old_transition not in source:
              raise SystemExit('Expected v0.7.14 transition block was not found')
          source = source.replace(old_transition, new_transition, 1)

          path.write_text(source, encoding='utf-8')
          PY

          node --check hotfix-build/scripts/render/webgl/webgl-renderer.js
          grep -q 'v0.7.15 bounded deterministic landing recovery' hotfix-build/scripts/render/webgl/webgl-renderer.js
          grep -q 'settleFaceAngle: 0.055' hotfix-build/scripts/render/webgl/webgl-renderer.js
          grep -q 'hardStopMs: 4700' hotfix-build/scripts/render/webgl/webgl-renderer.js
          grep -q 'const eased = 0;' hotfix-build/scripts/render/webgl/webgl-renderer.js

          (cd hotfix-build && zip -qr ../genesys-dice-forge-v0.7.15.new.zip .)
          mv genesys-dice-forge-v0.7.15.new.zip genesys-dice-forge.zip
          mkdir -p dist
          cp genesys-dice-forge.zip dist/genesys-dice-forge-v0.7.15.zip

      - name: Verify manifest and package
        shell: bash
        run: |
          set -euo pipefail
          unzip -p genesys-dice-forge.zip module.json > /tmp/gdf-module.json
          python - <<'PY'
          import json
          with open('/tmp/gdf-module.json', encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['id'] == 'genesys-dice-forge'
          assert manifest['version'] == '0.7.15'
          assert manifest['download'].endswith('/dist/genesys-dice-forge-v0.7.15.zip')
          print('Verified Genesys Dice Forge', manifest['version'])
          PY
          unzip -p genesys-dice-forge.zip scripts/render/webgl/webgl-renderer.js | grep -q 'v0.7.15 bounded deterministic landing recovery'

      - name: Commit hotfix package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genesys-dice-forge.zip dist/genesys-dice-forge-v0.7.15.zip
          if git diff --cached --quiet; then
            echo 'Package already current.'
            exit 0
          fi
          git commit -m 'Build stable Genesys Dice Forge v0.7.15 package'
          git push
