name: Audit Dice Forge Audio Noise Floors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-audio-noise.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
      - name: Analyze sample noise floors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit-audio
          mkdir audit-audio
          unzip -q genesys-dice-forge.zip -d audit-audio
          python - <<'PY'
          import math, pathlib, subprocess, numpy as np

          files = sorted(pathlib.Path('audit-audio/assets/audio/dice').glob('*.ogg'))
          rows=[]
          for f in files:
              raw = subprocess.check_output([
                  'ffmpeg','-v','error','-i',str(f),'-ac','1','-ar','24000','-f','f32le','-'
              ])
              x=np.frombuffer(raw,dtype=np.float32)
              sr=24000
              dur=len(x)/sr
              if len(x)<sr//20:
                  continue
              # 20ms windows. Estimate "background" from the quietest 25% of
              # frames and compare it to active/transient level.
              n=max(1,int(sr*0.020))
              m=(len(x)//n)*n
              frames=x[:m].reshape(-1,n)
              rms=np.sqrt(np.mean(frames*frames,axis=1)+1e-15)
              db=20*np.log10(rms+1e-12)
              quiet=np.percentile(db,25)
              median=np.percentile(db,50)
              active=np.percentile(db,90)
              peak=20*math.log10(float(np.max(np.abs(x)))+1e-12)
              # high-frequency share in quietest frames: hiss tends to stand out.
              qidx=np.argsort(rms)[:max(1,len(rms)//4)]
              q=frames[qidx].reshape(-1)
              spec=np.abs(np.fft.rfft(q))**2
              freqs=np.fft.rfftfreq(len(q),1/sr)
              total=float(spec.sum()+1e-18)
              hf=float(spec[freqs>=4000].sum()/total)
              rows.append((f.name,dur,quiet,median,active,peak,hf,active-quiet))
          print('file,duration_s,quiet25_db,median_db,active90_db,peak_db,hf_quiet_share,dynamic_gap_db')
          for r in rows:
              print(f'{r[0]},{r[1]:.3f},{r[2]:.2f},{r[3]:.2f},{r[4]:.2f},{r[5]:.2f},{r[6]:.4f},{r[7]:.2f}')
          # Suspicion score: unusually loud quiet floor + lots of HF energy +
          # compressed gap between quiet floor and active transient level.
          q=np.array([r[2] for r in rows])
          hf=np.array([r[6] for r in rows])
          gap=np.array([r[7] for r in rows])
          def z(a):
              s=a.std() or 1
              return (a-a.mean())/s
          score=z(q)+0.8*z(hf)-0.5*z(gap)
          order=np.argsort(score)[::-1]
          print('\nMOST_SUSPICIOUS_BACKGROUND_NOISE:')
          for i in order:
              print(f'{rows[i][0]} score={score[i]:.3f}')
          PY
