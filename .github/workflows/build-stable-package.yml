name: Build Stable Foundry Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/api.js"
      - "scripts/main.js"
      - "scripts/integration/genesys-auto-bridge.js"
      - "scripts/integration/render-chat-capture.js"
      - "scripts/integration/chat-launcher.js"
      - "scripts/integration/face-audit.js"
      - "styles/chat-launcher.css"
      - "styles/face-audit.css"
      - "patches/webgl-roll-profiles-v0.7.8.patch"
      - "patches/webgl-guided-settle-v0.7.9.patch"
      - ".github/workflows/build-stable-package.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild stable module zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build dist
          unzip -q genesys-dice-forge.zip -d build
          cp module.json build/module.json
          cp README.md build/README.md
          cp CHANGELOG.md build/CHANGELOG.md
          mkdir -p build/scripts/integration build/styles
          cp scripts/api.js build/scripts/api.js
          cp scripts/main.js build/scripts/main.js
          cp scripts/integration/genesys-auto-bridge.js build/scripts/integration/genesys-auto-bridge.js
          cp scripts/integration/render-chat-capture.js build/scripts/integration/render-chat-capture.js
          cp scripts/integration/chat-launcher.js build/scripts/integration/chat-launcher.js
          cp scripts/integration/face-audit.js build/scripts/integration/face-audit.js
          cp styles/chat-launcher.css build/styles/chat-launcher.css
          cp styles/face-audit.css build/styles/face-audit.css

          if ! grep -q 'const ROLL_PROFILES' build/scripts/render/webgl/webgl-renderer.js; then
            (cd build && patch -p1 < ../patches/webgl-roll-profiles-v0.7.8.patch)
          fi
          if ! grep -q 'const GUIDED_SETTLE' build/scripts/render/webgl/webgl-renderer.js; then
            (cd build && patch -p1 < ../patches/webgl-guided-settle-v0.7.9.patch)
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('build/scripts/render/webgl/webgl-renderer.js')
          source = path.read_text(encoding='utf-8')

          # Historical transforms are retained so a clean rebuild from an older
          # stable package still converges on the approved no-final-twist baseline.
          transforms = [
              ('  sleepFaceAngle: 0.11,\n  graceMs: 380', '  sleepFaceAngle: 0.025,\n  graceMs: 1200'),
              ('  const targetAngularSpeed = Math.min(\n    7.4,\n    angle * (3.6 + deadlineRamp * 2.6)\n  );', '  const targetAngularSpeed = Math.min(\n    8.8,\n    angle * (4.0 + deadlineRamp * 3.4)\n  );'),
              ('  const torque = Math.min(\n    9.0,\n    angle * (4.8 + deadlineRamp * 3.0)\n  ) * strength;', '  const torque = Math.min(\n    12.0,\n    angle * (5.2 + deadlineRamp * 4.2)\n  ) * strength;'),
              ('          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          if (allSleeping || guidanceGraceExpired) beginSettle(now);', '          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          const facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.sleepFaceAngle);\n          const emergencyExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs + 1200;\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || emergencyExpired) beginSettle(now);'),
              ('          entry.settleFromRotation = entry.rotation;\n          entry.settleFromPosition = [...entry.position];\n          entry.targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);', '          entry.settleFromRotation = Array.isArray(entry.rotation) ? [...entry.rotation] : [0, 0, 0, 1];\n          entry.settleFromPosition = [...entry.position];\n          entry.targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.settleFromRotation);'),
              ('            const rotation = quatSlerp(entry.settleFromRotation, entry.targetRotation, eased);', '            const rotation = entry.settleFromRotation ?? entry.rotation ?? [0, 0, 0, 1];'),
              ('            for (const entry of this.activeDice) {\n              entry.position = [...entry.finalPosition];\n              entry.rotation = entry.targetRotation;\n              entry.opacity = 1;\n            }', '            for (const entry of this.activeDice) {\n              // v0.7.11: hold exactly the last rendered physical pose. Do not snap\n              // to targetRotation when settle completes. That snap was the last knyck.\n              entry.position = [...entry.position];\n              entry.rotation = Array.isArray(entry.rotation) ? [...entry.rotation] : [0, 0, 0, 1];\n              entry.opacity = 1;\n            }'),
              ('      position: entry.finalPosition ? [...entry.finalPosition] : [...entry.position],\n      rotation: entry.targetRotation,', '      position: [...entry.position],\n      rotation: Array.isArray(entry.rotation) ? [...entry.rotation] : [0, 0, 0, 1],')
          ]

          for old, new in transforms:
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'Missing renderer transform target: {old[:100]!r}')

          if 'const eased = 0;' not in source:
              source = source.replace('const eased = smoothstep(0, 1, t);', 'const eased = 0;', 1)
          if 'const eased = 0;' not in source:
              raise SystemExit('Missing zero-rotation settle guard')

          # If rebuilding from pre-v0.7.14, first install its deterministic recovery.
          if 'v0.7.14 deterministic landing recovery' not in source and 'v0.7.15 bounded deterministic landing recovery' not in source:
              constants_old = '''  sleepFaceAngle: 0.025,\n  graceMs: 1200\n});'''
              constants_new = '''  sleepFaceAngle: 0.025,\n  graceMs: 1200,\n  hardAssistStartMs: 350,\n  hardAssistRate: 5.4,\n  hardAssistMaxStep: 0.10,\n  absoluteSafetyMs: 5200\n});'''
              if constants_old not in source:
                  raise SystemExit('Missing GUIDED_SETTLE constants target for v0.7.14')
              source = source.replace(constants_old, constants_new, 1)

              guide_old = '''  const torque = Math.min(\n    12.0,\n    angle * (5.2 + deadlineRamp * 4.2)\n  ) * strength;\n  entry.angularVelocity[0] += axisX * torque * dt;\n  entry.angularVelocity[2] += axisZ * torque * dt;\n}'''
              guide_new = '''  const torque = Math.min(\n    12.0,\n    angle * (5.2 + deadlineRamp * 4.2)\n  ) * strength;\n  entry.angularVelocity[0] += axisX * torque * dt;\n  entry.angularVelocity[2] += axisZ * torque * dt;\n\n  // v0.7.14 deterministic landing recovery. Once the normal roll is already\n  // deep into its late-energy phase, blend the CURRENT physical orientation a\n  // tiny amount toward the shortest face-up orientation each physics substep.\n  // This stays inside the physics phase so hold/fade never perform a final snap.\n  const hardAssistStart = entry.rollProfile.maxSimulationMs + GUIDED_SETTLE.hardAssistStartMs;\n  if (simulationElapsedMs >= hardAssistStart && angle > GUIDED_SETTLE.sleepFaceAngle) {\n    const overtime = clamp((simulationElapsedMs - hardAssistStart) / 900, 0, 1);\n    const targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n    const assist = clamp(\n      dt * GUIDED_SETTLE.hardAssistRate * (0.45 + overtime * 0.55),\n      0,\n      GUIDED_SETTLE.hardAssistMaxStep\n    );\n    entry.rotation = quatSlerp(entry.rotation, targetRotation, assist);\n\n    const minRoll = 0.34 + overtime * 0.16;\n    entry.angularVelocity[0] += axisX * minRoll * dt;\n    entry.angularVelocity[2] += axisZ * minRoll * dt;\n  }\n}'''
              if guide_old not in source:
                  raise SystemExit('Missing guideResultFace target for v0.7.14')
              source = source.replace(guide_old, guide_new, 1)

              transition_old = '''          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          const facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.sleepFaceAngle);\n          const emergencyExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs + 1200;\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || emergencyExpired) beginSettle(now);'''
              transition_new = '''          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          const facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.sleepFaceAngle);\n          const absoluteSafetyExpired = elapsed >= GUIDED_SETTLE.absoluteSafetyMs;\n\n          // Never enter hold with the wrong physical face merely because a timer\n          // expired. The authoritative face must be acquired during motion first.\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || (absoluteSafetyExpired && facesReady)) beginSettle(now);'''
              if transition_old not in source:
                  raise SystemExit('Missing physics-to-settle transition target for v0.7.14')
              source = source.replace(transition_old, transition_new, 1)

          # v0.7.15: v0.7.14 could keep feeding angular energy while waiting for
          # an extremely tight face angle, causing a die to visibly freak out.
          # Bound recovery, damp the assisted roll, and guarantee termination with
          # at most a tiny in-motion face correction before hold.
          if 'v0.7.15 bounded deterministic landing recovery' not in source:
              old_constants = '''  hardAssistStartMs: 350,\n  hardAssistRate: 5.4,\n  hardAssistMaxStep: 0.10,\n  absoluteSafetyMs: 5200'''
              new_constants = '''  hardAssistStartMs: 350,\n  hardAssistRate: 6.2,\n  hardAssistMaxStep: 0.12,\n  settleFaceAngle: 0.055,\n  hardStopMs: 4700'''
              if old_constants not in source:
                  raise SystemExit('Missing v0.7.14 recovery constants for v0.7.15')
              source = source.replace(old_constants, new_constants, 1)

              old_recovery = '''  // v0.7.14 deterministic landing recovery. Once the normal roll is already\n  // deep into its late-energy phase, blend the CURRENT physical orientation a\n  // tiny amount toward the shortest face-up orientation each physics substep.\n  // This stays inside the physics phase so hold/fade never perform a final snap.\n  const hardAssistStart = entry.rollProfile.maxSimulationMs + GUIDED_SETTLE.hardAssistStartMs;\n  if (simulationElapsedMs >= hardAssistStart && angle > GUIDED_SETTLE.sleepFaceAngle) {\n    const overtime = clamp((simulationElapsedMs - hardAssistStart) / 900, 0, 1);\n    const targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n    const assist = clamp(\n      dt * GUIDED_SETTLE.hardAssistRate * (0.45 + overtime * 0.55),\n      0,\n      GUIDED_SETTLE.hardAssistMaxStep\n    );\n    entry.rotation = quatSlerp(entry.rotation, targetRotation, assist);\n\n    const minRoll = 0.34 + overtime * 0.16;\n    entry.angularVelocity[0] += axisX * minRoll * dt;\n    entry.angularVelocity[2] += axisZ * minRoll * dt;\n  }'''
              new_recovery = '''  // v0.7.15 bounded deterministic landing recovery. Keep the correction inside\n  // the visible physics phase, but remove energy as we converge so the die cannot\n  // enter a perpetual assisted wobble/spin while chasing the exact face angle.\n  const hardAssistStart = entry.rollProfile.maxSimulationMs + GUIDED_SETTLE.hardAssistStartMs;\n  if (simulationElapsedMs >= hardAssistStart && angle > GUIDED_SETTLE.settleFaceAngle) {\n    const overtime = clamp((simulationElapsedMs - hardAssistStart) / 850, 0, 1);\n    const targetRotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n    const assist = clamp(\n      dt * GUIDED_SETTLE.hardAssistRate * (0.55 + overtime * 0.45),\n      0,\n      GUIDED_SETTLE.hardAssistMaxStep\n    );\n    entry.rotation = quatSlerp(entry.rotation, targetRotation, assist);\n\n    const damping = Math.pow(0.20, dt);\n    entry.angularVelocity[0] *= damping;\n    entry.angularVelocity[2] *= damping;\n    entry.velocity[0] *= Math.pow(0.30, dt);\n    entry.velocity[2] *= Math.pow(0.30, dt);\n  }'''
              if old_recovery not in source:
                  raise SystemExit('Missing v0.7.14 recovery block for v0.7.15')
              source = source.replace(old_recovery, new_recovery, 1)

              old_transition = '''          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          const facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.sleepFaceAngle);\n          const absoluteSafetyExpired = elapsed >= GUIDED_SETTLE.absoluteSafetyMs;\n\n          // Never enter hold with the wrong physical face merely because a timer\n          // expired. The authoritative face must be acquired during motion first.\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || (absoluteSafetyExpired && facesReady)) beginSettle(now);'''
              new_transition = '''          const guidanceGraceExpired = elapsed >= rollProfile.maxSimulationMs + GUIDED_SETTLE.graceMs;\n          let facesReady = this.activeDice.every((entry) => resultFaceError(entry).angle < GUIDED_SETTLE.settleFaceAngle);\n          const hardStopExpired = elapsed >= GUIDED_SETTLE.hardStopMs;\n\n          if (hardStopExpired && !facesReady) {\n            for (const entry of this.activeDice) {\n              const error = resultFaceError(entry);\n              if (error.angle >= GUIDED_SETTLE.settleFaceAngle) {\n                // Safety correction is still made before settle/hold begins. By\n                // this point velocity has already been heavily damped, so this is\n                // a bounded few-degree acquisition rather than a late wild spin.\n                entry.rotation = buildFaceUpTargetRotation(entry.mesh.geometry, entry.die.faceIndex, entry.rotation);\n                entry.angularVelocity[0] = 0;\n                entry.angularVelocity[2] = 0;\n              }\n            }\n            facesReady = true;\n          }\n\n          if ((allSleeping && facesReady) || (guidanceGraceExpired && facesReady) || hardStopExpired) beginSettle(now);'''
              if old_transition not in source:
                  raise SystemExit('Missing v0.7.14 transition block for v0.7.15')
              source = source.replace(old_transition, new_transition, 1)

          path.write_text(source, encoding='utf-8')
          PY

          node --check build/scripts/render/webgl/webgl-renderer.js
          node --check build/scripts/integration/chat-launcher.js
          node --check build/scripts/integration/face-audit.js
          grep -q 'before-utilities' build/scripts/integration/chat-launcher.js
          grep -q '52-FACE VISUAL QA' build/scripts/integration/face-audit.js
          grep -q 'v0.7.15 bounded deterministic landing recovery' build/scripts/render/webgl/webgl-renderer.js
          grep -q 'settleFaceAngle: 0.055' build/scripts/render/webgl/webgl-renderer.js
          grep -q 'hardStopMs: 4700' build/scripts/render/webgl/webgl-renderer.js
          grep -q 'const eased = 0;' build/scripts/render/webgl/webgl-renderer.js

          (cd build && zip -qr ../genesys-dice-forge.new.zip .)
          mv genesys-dice-forge.new.zip genesys-dice-forge.zip
          cp genesys-dice-forge.zip dist/genesys-dice-forge-v0.7.15.zip

      - name: Verify package manifest
        shell: bash
        run: |
          set -euo pipefail
          unzip -p genesys-dice-forge.zip module.json > /tmp/gdf-module.json
          python - <<'PY'
          import json
          with open('/tmp/gdf-module.json', encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['id'] == 'genesys-dice-forge'
          assert manifest['version'] == '0.7.15'
          assert manifest['compatibility']['minimum'] == '13.351'
          assert str(manifest['compatibility']['maximum']) == '14'
          assert 'scripts/integration/chat-launcher.js' in manifest['esmodules']
          assert 'scripts/integration/face-audit.js' in manifest['esmodules']
          assert 'styles/chat-launcher.css' in manifest['styles']
          assert 'styles/face-audit.css' in manifest['styles']
          print('Verified Genesys Dice Forge', manifest['version'])
          PY

      - name: Commit stable package if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- genesys-dice-forge.zip dist/genesys-dice-forge-v0.7.15.zip; then
            echo "Stable package already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genesys-dice-forge.zip dist/genesys-dice-forge-v0.7.15.zip
          git commit -m "Build stable Genesys Dice Forge v0.7.15 package"
          git push
