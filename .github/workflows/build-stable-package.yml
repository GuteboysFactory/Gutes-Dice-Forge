name: Build Stable Foundry Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/**"
      - "styles/**"
      - ".github/workflows/build-stable-package.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild package from approved stable runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build dist
          unzip -q genesys-dice-forge.zip -d build

          cp module.json build/module.json
          cp README.md build/README.md
          cp CHANGELOG.md build/CHANGELOG.md
          mkdir -p build/scripts/integration build/styles
          cp scripts/api.js build/scripts/api.js
          cp scripts/main.js build/scripts/main.js
          cp scripts/integration/genesys-auto-bridge.js build/scripts/integration/genesys-auto-bridge.js
          cp scripts/integration/render-chat-capture.js build/scripts/integration/render-chat-capture.js
          cp scripts/integration/chat-launcher.js build/scripts/integration/chat-launcher.js
          cp scripts/integration/face-audit.js build/scripts/integration/face-audit.js
          cp styles/chat-launcher.css build/styles/chat-launcher.css
          cp styles/face-audit.css build/styles/face-audit.css

          VERSION=$(python - <<'PY'
          import json
          with open('module.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          echo "Packaging Genesys Dice Forge ${VERSION}"

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find build/scripts -type f -name '*.js' -print0)

          grep -q 'NATURAL_LANDING_AUTHORITATIVE_FACE_REMAP' build/scripts/render/webgl/webgl-renderer.js
          grep -q 'uDisplayTopFaceIndex' build/scripts/render/webgl/shaders.js
          grep -q 'topPhysicalFaceIndex(entry)' build/scripts/render/webgl/webgl-renderer.js
          if grep -q '^  guideResultFace(entry, dt, simulationElapsedMs);' build/scripts/render/webgl/webgl-renderer.js; then
            echo 'ERROR: target-face guidance was reactivated.'
            exit 1
          fi
          if grep -q 'entry.rotation = entry.targetRotation' build/scripts/render/webgl/webgl-renderer.js; then
            echo 'ERROR: final targetRotation snap was reintroduced.'
            exit 1
          fi

          grep -q 'Hooks.on("renderChatMessageHTML"' build/scripts/integration/render-chat-capture.js
          python - <<'PY'
          from pathlib import Path
          import re
          deprecated = re.compile(r'''Hooks\.on\(\s*["']renderChatMessage["']\s*,''')
          offenders = []
          for path in Path('build/scripts').rglob('*.js'):
              text = path.read_text(encoding='utf-8')
              if deprecated.search(text): offenders.append(str(path))
          if offenders:
              raise SystemExit('Deprecated renderChatMessage hook found: ' + ', '.join(offenders))
          print('PASS modern renderChatMessageHTML hook only')
          PY

          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          const mod = await import(pathToFileURL(path.resolve('build/scripts/core/dice-types.js')).href);
          const expectedSides = { boost: 6, setback: 6, ability: 8, difficulty: 8, proficiency: 12, challenge: 12 };
          let total = 0;
          for (const [type, sides] of Object.entries(expectedSides)) {
            const def = mod.DICE_TYPES[type];
            if (!def || def.sides !== sides || def.faces.length !== sides) throw new Error(`Bad ${type} definition`);
            total += sides;
          }
          if (total !== 52) throw new Error(`Expected 52 faces, found ${total}`);
          console.log('PASS 52/52 narrative face inventory');
          NODE

          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('build')
          with open(root / 'module.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m['id'] == 'genesys-dice-forge'
          assert m['compatibility']['minimum'] == '13.351'
          assert str(m['compatibility']['maximum']) == '14'
          assert m['download'].endswith(f"/dist/genesys-dice-forge-v{m['version']}.zip")
          for rel in m.get('esmodules', []):
              assert (root / rel).is_file(), f'Missing esmodule: {rel}'
          for rel in m.get('styles', []):
              assert (root / rel).is_file(), f'Missing style: {rel}'
          api = (root / 'scripts/api.js').read_text(encoding='utf-8')
          match = re.search(r'''get version\(\)\s*\{\s*return\s+["']([^"']+)''', api)
          assert match and match.group(1) == m['version'], f"API version mismatch: {match.group(1) if match else 'missing'} vs {m['version']}"
          print('PASS manifest/API/package consistency', m['version'])
          PY

          rm -f "dist/genesys-dice-forge-v${VERSION}.zip"
          (cd build && zip -qr "../genesys-dice-forge.new.zip" .)
          mv genesys-dice-forge.new.zip genesys-dice-forge.zip
          cp genesys-dice-forge.zip "dist/genesys-dice-forge-v${VERSION}.zip"
          echo "$VERSION" > /tmp/gdf-version

      - name: Verify rebuilt archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat /tmp/gdf-version)
          unzip -tq genesys-dice-forge.zip
          unzip -p genesys-dice-forge.zip module.json > /tmp/gdf-module.json
          python - <<'PY'
          import json
          with open('/tmp/gdf-module.json', encoding='utf-8') as f:
              m=json.load(f)
          print('Verified archive:', m['title'], m['version'])
          PY
          test -f "dist/genesys-dice-forge-v${VERSION}.zip"

      - name: Commit stable package if changed
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat /tmp/gdf-version)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genesys-dice-forge.zip "dist/genesys-dice-forge-v${VERSION}.zip"
          if git diff --cached --quiet; then
            echo 'Stable package already current.'
            exit 0
          fi
          git commit -m "Build stable Genesys Dice Forge v${VERSION} package"
          git push
